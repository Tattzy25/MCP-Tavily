<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Tools Admin Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 600;
        }

        .status-badge {
            background: var(--success);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
        }

        .card-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .card-header h2 {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: var(--light);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .tools-list {
            list-style: none;
        }

        .tool-item {
            background: var(--light);
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .tool-info p {
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .health-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online {
            background: var(--success);
        }

        .status-offline {
            background: var(--danger);
        }

        .status-warning {
            background: var(--warning);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1><i class="fas fa-cogs"></i> MCP Tools Admin Panel</h1>
            <div class="status-badge">
                <i class="fas fa-circle"></i> Online
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-heartbeat"></i> System Health</h2>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="uptime">--</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="memory">--</div>
                        <div class="stat-label">Memory</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="requests">--</div>
                        <div class="stat-label">Requests</div>
                    </div>
                </div>
                <div class="health-status" style="margin-top: 1rem;">
                    <span class="status-indicator status-online"></span>
                    <span>Redis Connection: Healthy</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-plus-circle"></i> Add New Tool</h2>
                </div>
                <form id="add-tool-form">
                    <div class="form-group">
                        <label for="tool-name">Tool Name</label>
                        <input type="text" id="tool-name" class="form-control" placeholder="Enter tool name" required>
                    </div>
                    <div class="form-group">
                        <label for="tool-description">Description</label>
                        <textarea id="tool-description" class="form-control" placeholder="Enter tool description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="tool-endpoint">API Endpoint</label>
                        <input type="url" id="tool-endpoint" class="form-control" placeholder="https://api.example.com/endpoint" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Tool
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-tools"></i> Current Tools</h2>
            </div>
            <ul class="tools-list" id="tools-list">
                <li class="tool-item">
                    <div class="tool-info">
                        <h3>Tavily Search</h3>
                        <p>Web search functionality powered by Tavily API</p>
                    </div>
                    <div>
                        <button class="btn btn-danger">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                </li>
                <!-- Tools will be populated dynamically -->
            </ul>
        </div>
    </div>

    <script>
        // Health monitoring
        async function updateHealthStats() {
            try {
                const response = await fetch('/health');
                const healthData = await response.json();
                
                document.getElementById('uptime').textContent = healthData.uptime || 'N/A';
                document.getElementById('memory').textContent = healthData.memory_usage || 'N/A';
                document.getElementById('requests').textContent = healthData.total_requests || '0';
                
            } catch (error) {
                console.error('Health check failed:', error);
            }
        }

        // Tool management
        document.getElementById('add-tool-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const toolData = {
                name: document.getElementById('tool-name').value,
                description: document.getElementById('tool-description').value,
                endpoint: document.getElementById('tool-endpoint').value
            };

            try {
                const response = await fetch('/admin/tools', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(toolData)
                });

                if (response.ok) {
                    alert('Tool added successfully!');
                    e.target.reset();
                    loadTools();
                } else {
                    alert('Failed to add tool');
                }
            } catch (error) {
                console.error('Error adding tool:', error);
                alert('Error adding tool');
            }
        });

        async function loadTools() {
            try {
                const response = await fetch('/admin/tools');
                const tools = await response.json();
                
                const toolsList = document.getElementById('tools-list');
                toolsList.innerHTML = '';
                
                tools.forEach(tool => {
                    const li = document.createElement('li');
                    li.className = 'tool-item';
                    li.innerHTML = `
                        <div class="tool-info">
                            <h3>${tool.name}</h3>
                            <p>${tool.description}</p>
                        </div>
                        <div>
                            <button class="btn btn-danger" onclick="removeTool('${tool.id}')">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                    `;
                    toolsList.appendChild(li);
                });
                
            } catch (error) {
                console.error('Error loading tools:', error);
            }
        }

        async function removeTool(toolId) {
            if (confirm('Are you sure you want to remove this tool?')) {
                try {
                    const response = await fetch(`/admin/tools/${toolId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert('Tool removed successfully!');
                        loadTools();
                    } else {
                        alert('Failed to remove tool');
                    }
                } catch (error) {
                    console.error('Error removing tool:', error);
                    alert('Error removing tool');
                }
            }
        }

        // Initialize
        updateHealthStats();
        loadTools();
        
        // Update health stats every 30 seconds
        setInterval(updateHealthStats, 30000);
    </script>
</body>
</html>
